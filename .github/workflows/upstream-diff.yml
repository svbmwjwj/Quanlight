name: upstream-diff

on:
  schedule:
    - cron: "0 1 * * 1" # Monday 09:00 Beijing time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compare v2fly with bundle manifests
        run: uv run quanlight diff-v2fly >> "$GITHUB_STEP_SUMMARY"
