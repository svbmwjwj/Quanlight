# Quanlight 匹配语义探针配置：只含探针规则，不含节点与私人信息。
# 测完请切回原来的配置。

[general]
server_check_url = http://cp.cloudflare.com/generate_204

[dns]
no-system
doh-server = https://223.5.5.5/dns-query

[policy]

[server_remote]

[filter_remote]
# order: open www.example.com
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/order-1.list, tag=order-1, force-policy=reject, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/order-2.list, tag=order-2, force-policy=direct, enabled=true
# type: open www.example.org
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/type-1.list, tag=type-1, force-policy=reject, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/type-2.list, tag=type-2, force-policy=direct, enabled=true
# local: open www.example.net
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/local-1.list, tag=local-1, force-policy=reject, enabled=true
# wildcard: open www.iana.org, iana.org
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/wildcard-1.list, tag=wildcard-1, force-policy=reject, enabled=true
# cname: open www.microsoft.com
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/probe/cname-1.list, tag=cname-1, force-policy=reject, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
host, www.example.net, direct
final, direct

[rewrite_local]

[task_local]

[http_backend]

[mitm]
