name = "china"
description = "Mainland China domains and IP ranges for everyday apps, connected directly"
order = 20

# 按本人常用场景整理（D-029）：每个常用应用取 v2fly 对应的公司文件，每次构建从上游同步。
# 国际站与海外业务不直连：只服务境外的 include 子文件写进 skip_includes。

[[upstream]]
kind = "v2fly"
file = "tencent"
apps = "WeChat, QQ"
skip_includes = ["webnovel"]

[[upstream]]
kind = "v2fly"
file = "xiaohongshu"
apps = "Xiaohongshu"

[[upstream]]
kind = "v2fly"
file = "alibaba"
apps = "Alipay, Taobao"
skip_includes = ["alibabacloud"]

[[upstream]]
kind = "v2fly"
file = "unionpay"
apps = "UnionPay (Yun Shan Fu)"

[[upstream]]
kind = "v2fly"
file = "boc"
apps = "Bank of China"

[[upstream]]
kind = "v2fly"
file = "cmb"
apps = "China Merchants Bank"

[[upstream]]
kind = "v2fly"
file = "jd"
apps = "JD"

[[upstream]]
kind = "v2fly"
file = "meituan"
apps = "Meituan"

[[upstream]]
kind = "v2fly"
file = "douyin"
apps = "Douyin"

[[upstream]]
kind = "v2fly"
file = "didi"
apps = "DiDi"

# Apple 服务除推送（APNs）外全部直连；APNs 由排在最前的 apns 列表强制走代理。
# v2fly 把其中不少 Apple 域名归为境外，这是本人有意直连，整源豁免反向检查。
[[upstream]]
kind = "v2fly"
file = "apple"
apps = "Apple services except APNs"
allow_foreign = true
reason = "Apple services except APNs connect directly by owner decision; APNs stays in the apns list"

[[upstream]]
kind = "dnsmasq-apple-china"
allow_foreign = true
reason = "Apple services except APNs connect directly by owner decision; APNs stays in the apns list"

# 其余国内流量的 IP 回退（D-006）。
[[upstream]]
kind = "china-operator-ip"

[[rule]]
type = "host-suffix"
value = "cn"
source = "manual"
reason = "mainland country-code TLD; covers 12306.cn and other .cn sites (D-029)"

# 从上游剔除的条目写成 [[exclude]]；反向检查命中但确认应直连的条目写成 [[keep]]，都须写 reason。

# 手写的 host-suffix, cn 同样会被 geolocation-!cn 中境外公司的 .cn 域名命中（如 scholar.google.cn），
# 沿用首次构建时本人的决定：.cn 整体直连。
[[keep]]
value = "cn"
reason = "mainland country-code TLD; overseas companies' .cn sites are reachable directly"

# 腾讯云在 v2fly 里以整个域名收录，境外区域只是带 @!cn 的子域，跳过子域并不能让它们离开直连。
# 剔除这些父域名后，国内区域解析到大陆网段仍直连，境外区域落到 final。
[[exclude]]
value = "myqcloud.com"
reason = "parent of overseas Tencent Cloud regions; mainland regions fall back to China IP ranges"

[[exclude]]
value = "tencentcos.cn"
reason = "parent of overseas Tencent Cloud regions; mainland regions fall back to China IP ranges"

[[exclude]]
value = "tencentcos.com"
reason = "parent of overseas Tencent Cloud regions; mainland regions fall back to China IP ranges"

[[exclude]]
value = "tencentcos.com.cn"
reason = "parent of overseas Tencent Cloud regions; mainland regions fall back to China IP ranges"

# v2fly apple 以 full: 收录这两个推送主机，生成的 host 规则会先于 APNs 的 host-suffix 命中（D-019）。
[[exclude]]
value = "init-p01st.push.apple.com"
reason = "APNs host; must reach the apns list instead of direct"

[[exclude]]
value = "init-s01st.push.apple.com"
reason = "APNs host; must reach the apns list instead of direct"

# 大陆 DNS 会把部分境外服务解析到其中国版节点，经 IP 回退直连后被导到中国版；剔除这些网段，让它们落到 final。
[[exclude]]
value = "52.130.0.0/15"
reason = "Azure China; mainland DNS resolves www.linkedin.com to LinkedIn China here, which redirects to linkedin.cn"

[[exclude]]
value = "202.89.232.0/21"
reason = "Bing China; mainland DNS resolves www.bing.com here, which serves cn.bing.com"
