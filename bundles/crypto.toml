name = "crypto"
description = "Crypto wallets, exchanges and on-chain services: Rainbow, Phantom, Kraken, Uniswap, Etherscan, Hyperliquid, Arweave, IPFS, plus the WalletConnect relay they use"
order = 30

[[rule]]
type = "host"
value = "relay.walletconnect.com"
role = "dependency"
source = "v2fly:category-cryptocurrency"

[[rule]]
type = "host"
value = "relay.walletconnect.org"
role = "dependency"
source = "v2fly:category-cryptocurrency"

