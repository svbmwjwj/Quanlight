# Quanlight iOS 模板（ios_whitelist.conf）
# 代理托底：APNs 强制走代理，中国大陆常用服务与大陆 IP 直连，其余由 final 走代理。
# 导入前替换所有 <...> 占位符；运行模式选“分流”，并开启“分流匹配优化”。
# 规则集：https://github.com/svbmwjwj/quanlight（订阅经境内镜像 ghfast.top 转发）

[general]
server_check_url = http://cp.cloudflare.com/generate_204
fallback_udp_policy = reject
# 运营商一键登录的认证域名不分配虚拟 IP，与官方 sample.conf 默认值相同。
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-system
doh-server = https://223.5.5.5/dns-query

[policy]
# 代理托底策略；名称与下方 force-policy、final 保持一致。
static=hello world ：）, resource-tag-regex=<your-subscription-tag>

[server_remote]
<your-server-subscription-url>, tag=<your-subscription-tag>, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
# 顺序有意义：apns 必须在 china 之前；update-interval=-1 关闭自动同步，发布后手动更新。
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/apns.list, tag=apns, force-policy=hello world ：）, update-interval=-1, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/china.list, tag=china, force-policy=direct, update-interval=-1, opt-parser=false, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
final, hello world ：）

[rewrite_local]

[task_local]

[http_backend]

[mitm]
