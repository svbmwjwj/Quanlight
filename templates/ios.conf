# quanlight iOS template: blacklist mode
# Only the services listed under [filter_remote] go through a proxy;
# everything else connects directly (final, direct).
# Replace every <...> placeholder before importing. Use "filter" running mode.
#
# Lists: https://github.com/svbmwjwj/quanlight
# Mainland China mirror used below: ghfast.top (third-party GitHub proxy).
# GitHub alternative: https://raw.githubusercontent.com/svbmwjwj/quanlight/release

[general]
server_check_url = http://cp.cloudflare.com/generate_204
fallback_udp_policy = reject
# Carrier one-tap login may need these hosts to bypass the fake-IP mapping.
;dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-system
# Encrypted DNS by IP endpoint, so no bootstrap query is needed.
doh-server = https://223.5.5.5/dns-query

[policy]
# Policy groups referenced by force-policy below. Adjust the tag regex to your
# server subscription's resource tag.
static=proxy, resource-tag-regex=<your-subscription-tag>
static=ai, resource-tag-regex=<your-subscription-tag>

[server_remote]
<your-server-subscription-url>, tag=<your-subscription-tag>, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
# Order matters: direct exceptions first, then the shared push service, then
# one list per service. Add more bundles from the release branch README.
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/direct-exceptions.list, tag=quanlight-direct-exceptions, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/apns.list, tag=quanlight-apns, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/telegram.list, tag=quanlight-telegram, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
# Personal exceptions go here, above the final rule.
final, direct

[rewrite_local]

[task_local]

[http_backend]

[mitm]
