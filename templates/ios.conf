# Quanlight iOS 模板：黑名单模式
# 只有 [filter_remote] 中列出的服务走代理，其余全部直连（final, direct）。
# 导入前替换所有 <...> 占位符；运行模式选“分流”。
#
# 规则集：https://github.com/svbmwjwj/quanlight
# 下方订阅使用境内镜像 ghfast.top（第三方 GitHub 代理）。
# GitHub 原始地址：https://raw.githubusercontent.com/svbmwjwj/quanlight/release

[general]
server_check_url = http://cp.cloudflare.com/generate_204
fallback_udp_policy = reject
# 运营商一键登录可能需要这些域名绕过虚拟 IP 映射。
;dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-system
# 使用 IP 端点的加密 DNS，无需先解析 DNS 服务器的域名。
doh-server = https://223.5.5.5/dns-query

[policy]
# 下方 force-policy 引用的自定义策略组；tag 正则改成你的节点订阅标签。
static=ai, resource-tag-regex=<your-subscription-tag>
static=crypto, resource-tag-regex=<your-subscription-tag>

[server_remote]
<your-server-subscription-url>, tag=<your-subscription-tag>, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
# 顺序有意义：直连例外在最前，其次是共用的推送服务，然后每个服务一个列表；
# 更窄的包排在更宽的包之前（如 claude 在 google 之前）。
# 删除服务包前注意依赖：YouTube 与 Claude 的 Google 登录依赖 google 包，
# 各钱包连接 dApp 依赖 shared-walletconnect 包。
# force-policy=proxy 指 Quantumult X 内置的代理策略。
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/direct-exceptions.list, tag=quanlight-direct-exceptions, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/apns.list, tag=quanlight-apns, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/claude.list, tag=quanlight-claude, force-policy=ai, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/shared-walletconnect.list, tag=quanlight-shared-walletconnect, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/rainbow.list, tag=quanlight-rainbow, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/phantom.list, tag=quanlight-phantom, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/kraken.list, tag=quanlight-kraken, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/uniswap.list, tag=quanlight-uniswap, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/etherscan.list, tag=quanlight-etherscan, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/hyperliquid.list, tag=quanlight-hyperliquid, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/arweave.list, tag=quanlight-arweave, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/ipfs.list, tag=quanlight-ipfs, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/telegram.list, tag=quanlight-telegram, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/twitter.list, tag=quanlight-twitter, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/github.list, tag=quanlight-github, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/linkedin.list, tag=quanlight-linkedin, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/youtube.list, tag=quanlight-youtube, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/google.list, tag=quanlight-google, force-policy=proxy, update-interval=86400, opt-parser=false, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true

[rewrite_remote]

[server_local]

