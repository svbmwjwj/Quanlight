# Quanlight iOS 黑名单模板（ios_blacklist.conf）
# 只有 [filter_remote] 中列出的服务走代理，其余全部直连（final, direct）。
# 导入前替换所有 <...> 占位符；运行模式选“分流”，并开启“分流匹配优化”。
#
# 规则集：https://github.com/svbmwjwj/quanlight
# 下方订阅使用境内镜像 ghfast.top（第三方 GitHub 代理）。
# GitHub 原始地址：https://raw.githubusercontent.com/svbmwjwj/quanlight/release

[general]
server_check_url = http://cp.cloudflare.com/generate_204
fallback_udp_policy = reject
# 运营商一键登录可能需要这些域名绕过虚拟 IP 映射。
;dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-system
# 使用 IP 端点的加密 DNS，无需先解析 DNS 服务器的域名。
doh-server = https://223.5.5.5/dns-query

[policy]
# 下方 force-policy 引用的策略组：main 为一般代理，ai 给 Claude，crypto 给加密货币相关服务；
# tag 正则改成你的节点订阅标签，可以给不同策略组指定不同节点。
static=main, resource-tag-regex=<your-subscription-tag>
static=ai, resource-tag-regex=<your-subscription-tag>
static=crypto, resource-tag-regex=<your-subscription-tag>

[server_remote]
<your-server-subscription-url>, tag=<your-subscription-tag>, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
# 顺序有意义：直连例外在最前，其次是共用的推送服务，然后每个服务一个列表；
# 更窄的包排在更宽的包之前（如 claude 在 google 之前）。
# 删除服务包前注意依赖：YouTube 与 Claude 的 Google 登录依赖 google 包。
# 规则集每天北京时间 02:00 构建，内容有变化才发布，update-interval=86400 与之对应；
# 每台设备每天约 11 次请求，远低于镜像与 GitHub 的限额，不要再调短。
# 下方地址都经 ghfast.top 转发；它不可用时，把前缀换成 README 中的 GitHub 或 jsDelivr 地址。
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/direct-exceptions.list, tag=direct-exceptions, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/apns.list, tag=apns, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/claude.list, tag=claude, force-policy=ai, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/crypto.list, tag=crypto, force-policy=crypto, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/telegram.list, tag=telegram, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/twitter.list, tag=twitter, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/github.list, tag=github, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/linkedin.list, tag=linkedin, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/youtube.list, tag=youtube, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
https://ghfast.top/https://raw.githubusercontent.com/svbmwjwj/quanlight/release/ios/google.list, tag=google, force-policy=main, update-interval=86400, opt-parser=false, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
# 个人例外写在这里，放在 final 之前。
final, direct

