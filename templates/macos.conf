# Quanlight macOS 模板：白名单模式
# 列出的中国大陆服务与大陆 IP 直连，其余全部走代理（final, proxy）。
# 导入前替换所有 <...> 占位符；运行模式选“分流”，并开启“分流匹配优化”。
#
# 过渡期：Quanlight 自己的 macOS 列表尚未建成，下方直连列表暂用
# blackmatrix7/ios_rule_script，之后会替换。

[general]
server_check_url = http://cp.cloudflare.com/generate_204
fallback_udp_policy = reject

[dns]
no-system
# 国内域名经阿里 DNS（IP 端点的 DoH）解析；落到下方 host-keyword 规则的域名
# 改由代理服务器解析。
doh-server = https://223.5.5.5/dns-query

[policy]
static=ai, resource-tag-regex=<your-subscription-tag>

[server_remote]
<your-server-subscription-url>, tag=<your-subscription-tag>, update-interval=86400, opt-parser=false, enabled=true

[filter_remote]
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Apple/Apple.list, tag=apple, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Microsoft/Microsoft.list, tag=microsoft, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Tencent/Tencent.list, tag=tencent, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/WeChat/WeChat.list, tag=wechat, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Alibaba/Alibaba.list, tag=alibaba, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/XianYu/XianYu.list, tag=xianyu, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/ByteDance/ByteDance.list, tag=bytedance, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Baidu/Baidu.list, tag=baidu, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/BiliBili/BiliBili.list, tag=bilibili, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/XiaoHongShu/XiaoHongShu.list, tag=xiaohongshu, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Cloudflarecn/Cloudflarecn.list, tag=cloudflare-cn, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
# 个人直连例外写在这里。

# Claude 及其第三方依赖（登录、身份验证、遥测、客服组件）走同一出口，
# 让服务方看到一致的地区。
host-suffix, anthropic.com, ai
host-suffix, claude.ai, ai
host-suffix, claude.com, ai
host-suffix, clau.de, ai
host-suffix, claudemcpclient.com, ai
host-suffix, claudemcpcontent.com, ai
host-suffix, claudeusercontent.com, ai
host, servd-anthropic-website.b-cdn.net, ai
host, anthropic.com.cdn.cloudflare.net, ai
host, anthropic.auth0.com, ai
host, anthropic-com.ghost.io, ai
host, maps.googleapis.com, ai
host-suffix, withpersona.com, ai
host-suffix, frompersona.com, ai
host-suffix, sentry.io, ai
host-suffix, statsigapi.net, ai
host, browser-intake-us5-datadoghq.com, ai
host-suffix, intercom.io, ai
host-suffix, intercomcdn.com, ai
host, cdn.usefathom.com, ai
ip-cidr, 160.79.104.0/21, ai
ip6-cidr, 2607:6bc0::/32, ai
ip-asn, 399358, ai

# 中国大陆国家代码域名。
host-suffix, cn, direct
host-suffix, xn--fiqs8s, direct

# 其余域名跳过本地 DNS，直接交给代理并由代理服务器解析。
# 纯 IP 请求不会被主机规则命中，会继续落到上方的 FILTER_REGION。
host-keyword, ., proxy
final, proxy

[rewrite_local]

